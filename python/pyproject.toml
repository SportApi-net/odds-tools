[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "odds-tools"
version = "0.1.1"
description = "Dependency-free betting odds math: format conversion, margin and no-vig fair odds, accumulators, system bets, Kelly staking, EV and arbitrage."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SportAPI" }]
keywords = [
  "odds", "betting", "sports-betting", "decimal-odds", "american-odds", "fractional-odds",
  "overround", "vig", "devig", "no-vig", "kelly-criterion", "arbitrage", "surebet", "parlay",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10", "build>=1"]

[project.urls]
Homepage = "https://sportapi.net"
"Live odds data (SportAPI)" = "https://sportapi.net/sport-line-api.html"
Repository = "https://github.com/SportApi-net/odds-tools"
Source = "https://github.com/SportApi-net/odds-tools/tree/main/python"
Issues = "https://github.com/SportApi-net/odds-tools/issues"
Changelog = "https://github.com/SportApi-net/odds-tools/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/odds_tools"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = ["PLR2004", "PLR0911", "PLR0913", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415"]

[tool.mypy]
strict = true
files = ["src", "tests"]
